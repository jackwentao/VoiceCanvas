<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceCanvas 前端交互原型</title>
    <link rel="stylesheet" href="./styles.css?v=stable-three-pane-locked" />
  </head>
  <body>
    <main class="prototype-shell">
      <header class="topbar">
        <section>
          <h1 id="projectTitle">VoiceCanvas</h1>
          <p id="projectMeta"></p>
        </section>
        <section class="topbar-actions">
          <nav class="scenario-actions" aria-label="演示指令">
            <button type="button" data-run="storyboard">三镜头分镜</button>
            <button type="button" data-run="arrow">添加箭头</button>
            <button type="button" data-run="clarification">触发澄清</button>
          </nav>
          <div class="settings-menu">
            <button
              type="button"
              id="settingsButton"
              class="settings-button"
              aria-haspopup="menu"
              aria-expanded="false"
              data-menu-toggle="settings"
            >
              <span aria-hidden="true"></span>
              <strong>设置</strong>
            </button>
            <div id="settingsMenu" class="settings-popover" role="menu" hidden>
              <button type="button" role="menuitem" data-project-action="new">新建项目</button>
              <button type="button" role="menuitem" data-project-action="load">载入项目</button>
              <button type="button" role="menuitem" data-run="export">导出 JSON</button>
              <button type="button" role="menuitem" data-project-action="export-image">导出图片</button>
            </div>
          </div>
        </section>
      </header>

      <section class="workspace-grid">
        <aside class="history-panel" aria-label="画布历史区">
          <div class="panel-header">
            <span>画布历史</span>
            <strong id="undoState"></strong>
          </div>
          <section>
            <h2>镜头</h2>
            <div id="sceneList" class="scene-list"></div>
          </section>
          <section>
            <h2>操作</h2>
            <ol id="operationTimeline" class="timeline"></ol>
          </section>
        </aside>

        <section class="canvas-panel" aria-label="结构化画布">
          <div class="canvas-toolbar">
            <section>
              <h2 id="activeSceneName"></h2>
              <p id="activeSceneDescription"></p>
            </section>
            <div class="scene-meta">
              <span id="sceneDuration"></span>
              <strong id="activeSceneNarration"></strong>
            </div>
          </div>
          <div class="canvas-frame">
            <div id="canvasSurface" class="canvas-surface" aria-label="当前镜头画布"></div>
          </div>
        </section>

        <aside class="ai-panel" aria-label="AI 交互栏">
          <div class="voice-card">
            <label for="voiceInput">语音转写</label>
            <div class="voice-action-row">
              <button type="button" class="voice-button" data-run="voice" aria-label="开始语音输入">
                <span class="voice-button-icon" aria-hidden="true"></span>
                <strong>语音输入</strong>
              </button>
              <span id="voiceStatus" class="voice-status">等待语音输入</span>
            </div>
            <div class="voice-input-row">
              <input
                id="voiceInput"
                type="text"
                value="创建一个三镜头的珍珠奶茶带货分镜，主打低糖和新品上市。"
              />
              <button type="button" data-run="custom" aria-label="发送转写文本">↵</button>
            </div>
          </div>

          <section id="stageIndicator" class="stage-indicator" data-stage="completed">
            <strong></strong>
            <span></span>
          </section>

          <section class="progress-card">
            <div>
              <span>执行进度</span>
              <strong id="progressText"></strong>
            </div>
            <div class="progress-track">
              <span id="progressBar"></span>
            </div>
          </section>

          <section id="clarificationCard" class="clarification-card" hidden>
            <h2>需要确认</h2>
            <p></p>
            <div class="option-list"></div>
          </section>

          <section class="summary-card">
            <h2>本轮总结</h2>
            <ul id="turnSummary"></ul>
          </section>

          <section class="event-card">
            <h2>运行事件</h2>
            <ol id="eventLog" class="event-log"></ol>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./app.js?v=stable-three-pane-locked"></script>
  </body>
</html>
