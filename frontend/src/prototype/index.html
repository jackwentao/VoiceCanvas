<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceCanvas 前端交互原型</title>
    <link rel="stylesheet" href="./styles.css?v=backend-state-events" />
  </head>
  <body>
    <main class="prototype-shell">
      <header class="topbar">
        <section>
          <h1 id="projectTitle">VoiceCanvas</h1>
          <p id="projectMeta"></p>
        </section>
        <section class="topbar-actions">
          <nav class="scenario-actions" aria-label="演示指令">
            <button type="button" data-run="storyboard">三镜头分镜</button>
            <button type="button" data-run="arrow">添加箭头</button>
            <button type="button" data-run="clarification">触发澄清</button>
          </nav>
          <div class="settings-menu">
            <button
              type="button"
              id="settingsButton"
              class="settings-button"
              aria-haspopup="menu"
              aria-expanded="false"
              data-menu-toggle="settings"
            >
              <span aria-hidden="true"></span>
              <strong>设置</strong>
            </button>
            <div id="settingsMenu" class="settings-popover" role="menu" hidden>
              <button type="button" role="menuitem" data-project-action="new">新建项目</button>
              <button type="button" role="menuitem" data-project-action="load">载入项目</button>
              <button type="button" role="menuitem" data-memory-action="open">长期记忆</button>
              <button type="button" role="menuitem" data-run="export">导出 JSON</button>
              <button type="button" role="menuitem" data-project-action="export-image">导出图片</button>
            </div>
          </div>
        </section>
      </header>

      <section class="workspace-grid">
        <aside class="history-panel" aria-label="画布历史区">
          <div class="panel-header">
            <span>画布历史</span>
            <strong id="undoState"></strong>
          </div>
          <section>
            <h2>镜头</h2>
            <div id="sceneList" class="scene-list"></div>
          </section>
          <section>
            <h2>操作</h2>
            <ol id="operationTimeline" class="timeline"></ol>
          </section>
        </aside>

        <section class="canvas-panel" aria-label="结构化画布">
          <div class="canvas-toolbar">
            <section>
              <h2 id="activeSceneName"></h2>
              <p id="activeSceneDescription"></p>
            </section>
            <div class="scene-meta">
              <span id="sceneDuration"></span>
              <strong id="activeSceneNarration"></strong>
            </div>
            <div class="background-controls" aria-label="画布背景颜色">
              <span>背景</span>
              <button type="button" data-background-color="#ffffff" style="--swatch:#ffffff" aria-label="白色背景"></button>
              <button type="button" data-background-color="#f6fbf6" style="--swatch:#f6fbf6" aria-label="浅绿背景"></button>
              <button type="button" data-background-color="#fff3bf" style="--swatch:#fff3bf" aria-label="浅黄背景"></button>
              <button type="button" data-background-color="#eaf2ff" style="--swatch:#eaf2ff" aria-label="浅蓝背景"></button>
              <input id="backgroundColorInput" type="color" value="#ffffff" aria-label="自定义背景颜色" />
            </div>
          </div>
          <div class="canvas-frame">
            <div id="canvasSurface" class="canvas-surface" aria-label="当前镜头画布"></div>
          </div>
        </section>

        <aside class="ai-panel" aria-label="AI 交互栏">
          <div class="voice-card">
            <label for="voiceInput">语音转写</label>
            <div class="voice-action-row">
              <button type="button" class="voice-button" data-run="voice" aria-label="开始语音创作">
                <span class="voice-button-icon" aria-hidden="true"></span>
                <strong>开始语音创作</strong>
              </button>
              <span id="voiceStatus" class="voice-status">等待语音输入</span>
            </div>
            <div class="voice-input-row">
              <input
                id="voiceInput"
                type="text"
                value="创建一个三镜头的珍珠奶茶带货分镜，主打低糖和新品上市。"
              />
              <button type="button" data-run="custom" aria-label="发送转写文本">↵</button>
            </div>
          </div>

          <section id="stageIndicator" class="stage-indicator" data-stage="completed">
            <strong></strong>
            <span></span>
          </section>

          <section class="progress-card">
            <div>
              <span>执行进度</span>
              <strong id="progressText"></strong>
            </div>
            <div class="progress-track">
              <span id="progressBar"></span>
            </div>
          </section>

          <section class="token-card">
            <div>
              <span>Token</span>
              <button type="button" data-telemetry-action="clear-tokens">清空</button>
            </div>
            <dl>
              <div>
                <dt>本轮</dt>
                <dd id="turnTokenUsage">0（输入 0 / 输出 0）</dd>
              </div>
              <div>
                <dt>累计</dt>
                <dd id="totalTokenUsage">0（输入 0 / 输出 0）</dd>
              </div>
            </dl>
          </section>

          <section id="clarificationCard" class="clarification-card" hidden>
            <h2>需要确认</h2>
            <p></p>
            <div class="option-list"></div>
          </section>

          <section class="summary-card">
            <h2>本轮总结</h2>
            <ul id="turnSummary"></ul>
          </section>

          <section class="event-card">
            <h2>运行事件</h2>
            <ol id="eventLog" class="event-log"></ol>
          </section>
        </aside>
      </section>

      <section id="memoryOverlay" class="memory-overlay" aria-label="长期记忆管理" hidden>
        <div class="memory-panel" role="dialog" aria-modal="true" aria-labelledby="memoryPanelTitle">
          <header>
            <section>
              <h2 id="memoryPanelTitle">长期记忆</h2>
              <p>管理跨项目生效的偏好和习惯</p>
            </section>
            <button type="button" class="icon-button" data-memory-action="close" aria-label="关闭长期记忆面板">×</button>
          </header>

          <section class="memory-create-form" aria-label="新增长期记忆">
            <textarea id="memoryContentInput" rows="3" placeholder="例如：用户喜欢清爽绿色、留白较多的带货视觉风格"></textarea>
            <div class="memory-form-row">
              <label>
                类型
                <select id="memoryKindInput"></select>
              </label>
              <label>
                范围
                <select id="memoryScopeInput"></select>
              </label>
              <button type="button" data-memory-action="create">新增</button>
            </div>
          </section>

          <p id="memoryError" class="memory-error" hidden></p>
          <div id="memoryList" class="memory-list"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js?v=backend-state-events"></script>
  </body>
</html>
