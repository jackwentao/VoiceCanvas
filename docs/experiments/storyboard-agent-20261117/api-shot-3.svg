<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#f7d9a0" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#e8b86d" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6b7f8e" stop-opacity="0.9" />
    </radialGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9744a" />
      <stop offset="55%" stop-color="#8a5a36" />
      <stop offset="100%" stop-color="#6b4226" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f4ede2" />
      <stop offset="100%" stop-color="#d8cbb8" />
    </linearGradient>
    <linearGradient id="saucerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7f0" />
      <stop offset="100%" stop-color="#cfc0aa" />
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3420" />
      <stop offset="100%" stop-color="#2e1a0e" />
    </linearGradient>
    <radialGradient id="bokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f5c96a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f5c96a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3cf" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fff3cf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa6b5" />
      <stop offset="100%" stop-color="#5c7385" />
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="lightBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="steamBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="shadowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  
  <g id="window-bg" filter="url(#softBlur)" opacity="0.85">
    <rect x="120" y="60" width="1040" height="420" rx="18" fill="url(#windowGrad)" />
    <rect x="150" y="90" width="460" height="360" rx="10" fill="#7d94a5" opacity="0.6" />
    <rect x="670" y="90" width="460" height="360" rx="10" fill="#7d94a5" opacity="0.6" />
    <line x1="620" y1="90" x2="620" y2="450" stroke="#4d6273" stroke-width="14" opacity="0.5" />
    <line x1="150" y1="270" x2="1130" y2="270" stroke="#4d6273" stroke-width="12" opacity="0.4" />
    
    <g stroke="#c8dbe8" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M230 120 q6 40 -2 80 q-4 30 2 60" />
      <path d="M310 150 q-4 50 4 90" />
      <path d="M420 110 q8 60 -2 110" />
      <path d="M520 180 q-6 40 2 80" />
      <path d="M740 130 q6 50 -2 100" />
      <path d="M860 160 q-4 60 4 100" />
      <path d="M980 120 q8 50 -2 90" />
      <path d="M1060 190 q-6 40 2 80" />
    </g>
  </g>

  
  <g id="bokeh-lights">
    <circle cx="260" cy="180" r="90" fill="url(#bokeh1)" filter="url(#lightBlur)" />
    <circle cx="540" cy="120" r="70" fill="url(#bokeh2)" filter="url(#lightBlur)" />
    <circle cx="820" cy="160" r="100" fill="url(#bokeh1)" filter="url(#lightBlur)" />
    <circle cx="1080" cy="140" r="80" fill="url(#bokeh3)" filter="url(#lightBlur)" />
    <circle cx="400" cy="300" r="55" fill="url(#bokeh2)" filter="url(#lightBlur)" opacity="0.7" />
    <circle cx="960" cy="320" r="65" fill="url(#bokeh3)" filter="url(#lightBlur)" opacity="0.6" />
    <circle cx="170" cy="360" r="50" fill="url(#bokeh1)" filter="url(#lightBlur)" opacity="0.5" />
    <circle cx="1140" cy="340" r="60" fill="url(#bokeh2)" filter="url(#lightBlur)" opacity="0.55" />
  </g>

  
  <g id="wood-counter">
    <rect x="0" y="500" width="1280" height="220" fill="url(#tableGrad)" />
    <rect x="0" y="500" width="1280" height="18" fill="#c08a5a" opacity="0.7" />
    <g stroke="#5a3820" stroke-width="2" opacity="0.25">
      <path d="M0 560 q320 12 640 0 q320 -12 640 0" />
      <path d="M0 620 q280 14 560 4 q360 -12 720 2" />
      <path d="M0 680 q400 10 800 0 q240 -6 480 2" />
    </g>
    
    <rect x="0" y="500" width="1280" height="6" fill="#e8b87a" opacity="0.6" />
  </g>

  
  <ellipse cx="640" cy="590" rx="190" ry="38" fill="#3a2414" opacity="0.45" filter="url(#shadowBlur)" />

  
  <g id="saucer">
    <ellipse cx="640" cy="565" rx="175" ry="42" fill="url(#saucerGrad)" />
    <ellipse cx="640" cy="558" rx="150" ry="32" fill="#f7f1e6" />
    <ellipse cx="640" cy="556" rx="120" ry="24" fill="#e8ddcc" opacity="0.6" />
    <path d="M465 565 q0 22 175 22 q175 0 175 -22" fill="none" stroke="#b8a68e" stroke-width="3" opacity="0.5" />
  </g>

  
  <g id="coffee-cup">
    
    <path d="M520 430 q-8 100 12 128 q18 22 108 22 q90 0 108 -22 q20 -28 12 -128 z" fill="url(#cupGrad)" />
    
    <ellipse cx="640" cy="430" rx="120" ry="30" fill="#fdfaf4" />
    <ellipse cx="640" cy="432" rx="104" ry="24" fill="url(#coffeeGrad)" />
    
    <ellipse cx="610" cy="426" rx="42" ry="10" fill="#8a5a36" opacity="0.5" />
    <ellipse cx="600" cy="422" rx="18" ry="5" fill="#c89a6a" opacity="0.4" />
    
    <path d="M520 430 q-8 100 12 128 q18 22 108 22 l0 -150 z" fill="#b8a68e" opacity="0.25" />
    
    <path d="M560 450 q-4 70 6 100" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5" />
    
    <path d="M760 460 q60 -10 58 40 q-2 50 -62 44" fill="none" stroke="#e8ddcc" stroke-width="22" stroke-linecap="round" />
    <path d="M760 460 q60 -10 58 40 q-2 50 -62 44" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  </g>

  
  <g id="steam" filter="url(#steamBlur)">
    <path d="M600 400 q-18 -40 6 -80 q20 -34 -2 -70" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55" />
    <path d="M640 395 q16 -46 -6 -86 q-18 -34 4 -66" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.5" />
    <path d="M680 400 q-14 -42 8 -78 q18 -32 -2 -64" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.45" />
    <path d="M620 390 q-8 -30 4 -58" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.35" />
    <path d="M660 392 q10 -32 -4 -60" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.35" />
  </g>

  
  <g id="promo-text">
    <text x="640" y="150" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="76" font-weight="700" fill="#4a2c1a" stroke="#3a2010" stroke-width="3" paint-order="stroke" letter-spacing="6">雨天咖啡买一送一</text>
    
    <path d="M340 185 q300 18 600 0" fill="none" stroke="#4a2c1a" stroke-width="4" stroke-linecap="round" opacity="0.55" />
    <circle cx="340" cy="185" r="5" fill="#4a2c1a" opacity="0.55" />
    <circle cx="940" cy="185" r="5" fill="#4a2c1a" opacity="0.55" />
  </g>

  
  <ellipse cx="640" cy="480" rx="320" ry="180" fill="#ffd98a" opacity="0.08" filter="url(#lightBlur)" />
</svg>