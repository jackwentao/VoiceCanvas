<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b7d" />
      <stop offset="0.55" stop-color="#7d8d9c" />
      <stop offset="1" stop-color="#a8b3ba" />
    </linearGradient>
    <linearGradient id="streetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5560" />
      <stop offset="0.5" stop-color="#5d6a74" />
      <stop offset="1" stop-color="#3d4750" />
    </linearGradient>
    <linearGradient id="warmWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" />
      <stop offset="0.6" stop-color="#f5b95c" />
      <stop offset="1" stop-color="#e09a3e" />
    </linearGradient>
    <linearGradient id="doorGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="raincoatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d" />
      <stop offset="0.6" stop-color="#f7c92e" />
      <stop offset="1" stop-color="#d9a81c" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a33" />
      <stop offset="1" stop-color="#5e3a1e" />
    </linearGradient>
    <linearGradient id="awningGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c96f3a" />
      <stop offset="1" stop-color="#9c4f26" />
    </linearGradient>
    <radialGradient id="puddleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="grainFilter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise" />
      <feComponentTransfer in="grayNoise" result="faintNoise">
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
      <feComposite in="faintNoise" in2="SourceGraphic" operator="over" />
    </filter>
    <clipPath id="windowClip">
      <rect x="700" y="250" width="300" height="230" rx="8" />
    </clipPath>
  </defs>

  
