<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5c" />
      <stop offset="100%" stop-color="#5a6b7a" />
    </linearGradient>
    <linearGradient id="streetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5560" />
      <stop offset="100%" stop-color="#3a4248" />
    </linearGradient>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd98a" />
      <stop offset="100%" stop-color="#e8a84c" />
    </linearGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe8a8" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#f5c060" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#e8a84c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4d0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="raincoatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd84d" />
      <stop offset="100%" stop-color="#e8b830" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a860" />
      <stop offset="100%" stop-color="#b88840" />
    </linearGradient>
    <linearGradient id="woodSign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6030" />
      <stop offset="100%" stop-color="#6a4820" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="rainBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
    <clipPath id="windowClip">
      <rect x="720" y="280" width="220" height="240" rx="6" />
    </clipPath>
  </defs>

  
