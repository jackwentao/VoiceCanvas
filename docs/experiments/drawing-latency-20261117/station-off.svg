      <stop offset="60%" stop-color="#d97a4a" />
      <stop offset="80%" stop-color="#f0b060" />
      <stop offset="100%" stop-color="#f5d090" />
    </linearGradient>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a5a" />
