<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F5C97A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C98A4B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C9A0" />
      <stop offset="100%" stop-color="#D4A878" />
    </linearGradient>
    <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B87A4B" />
      <stop offset="100%" stop-color="#8B5A32" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A8FA6" />
      <stop offset="100%" stop-color="#5A6E85" />
    </linearGradient>
    <linearGradient id="raincoatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD93D" />
      <stop offset="100%" stop-color="#F0B820" />
    </linearGradient>
    <linearGradient id="apronGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D5A3D" />
      <stop offset="100%" stop-color="#1E3D2A" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF5" />
      <stop offset="100%" stop-color="#E8E4DA" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feComponentTransfer in="grayNoise" result="fadedNoise">
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fadedNoise" mode="multiply" />
    </filter>
    <clipPath id="windowClip">
      <rect x="920" y="120" width="300" height="340" rx="8" />
    </clipPath>
  </defs>

  
